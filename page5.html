<!DOCTYPE html>
<html lang="ar" >
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>في حاجات نفسي أقولها ليكي</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Amiri&display=swap');

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 100%);
      font-family: 'Amiri', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
      direction: rtl;
      text-align: center;
    }

    .container {
      background-color: #fff7fa;
      border-radius: 25px;
      padding: 40px;
      max-width: 700px;
      box-shadow: 0 0 20px rgba(240, 98, 146, 0.4);
    }

    h2 {
      font-size: 30px;
      color: #ad1457;
      margin-bottom: 25px;
    }

    p {
      font-size: 22px;
      color: #6a1b9a;
      line-height: 1.7;
      margin-bottom: 35px;
    }

    button {
      padding: 12px 35px;
      font-size: 20px;
      background-color: #d81b60;
      color: white;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      box-shadow: 0 5px 15px rgba(216, 27, 96, 0.4);
    }

    button:hover {
      background-color: #ad1457;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>في حاجات نفسي أقولها ليكي...</h2>
    <p>
      ساعات كتير بحس إن في كلام جوه قلبي مش قادر أطلعه.<br />
      كلمات كبيرة بس بسيطة في نفس الوقت.<br />
      حاجات كتير بحسها، ومحتاج أشاركها معاكي.<br />
      بس قبل ما أقول أي حاجة... عايزك تعرفي إن كل كلمة جاية من قلبي.
    </p>
    <button onclick="goToNext()">استمعي لي</button>
  </div>

  <script>
    function goToNext() {
      window.location.href = "page6.html";
    }
  </script>
</body>
</html>
