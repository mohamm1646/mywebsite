<!DOCTYPE html>
<html lang="ar" >
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>أنا بحبك</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Scheherazade&display=swap');

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #f8bbd0, #f48fb1);
      font-family: 'Scheherazade', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
      direction: rtl;
      text-align: center;
      color: #880e4f;
    }

    .container {
      background-color: #fff0f5;
      border-radius: 30px;
      padding: 45px 40px;
      max-width: 700px;
      box-shadow: 0 0 25px rgba(255, 105, 180, 0.5);
      position: relative;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 30px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    p {
      font-size: 24px;
      line-height: 1.6;
      margin-bottom: 50px;
    }

    .signature {
      font-size: 36px;
      color: #ad1457;
      font-weight: 700;
      letter-spacing: 5px;
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>أنا بحبك</h1>
    <p>
      بكل صدق، بكل قلب، بكل ما فيّ من مشاعر...<br />
      أنا بحبك أكتر من أي كلام أو تعبير.<br />
      وأتمنى تكوني جنب قلبي دايمًا، لأنك أغلى حاجة عندي.
    </p>
    <div class="signature">M❤M</div>
  </div>
</body>
</html>
